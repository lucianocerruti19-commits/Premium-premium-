<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tutto Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d4af37">

  <!-- ✅ Estilos Premium -->
  <link rel="stylesheet" href="styles.css">
</head> <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d4af37">


<body>

<header>
  <h1>🍕 Tutto Platform</h1>
  <p>Pedidos Delivery Premium</p>
</header>

<!-- ✅ Productos -->
<div id="products"></div>

<!-- ✅ Carrito -->
<div class="card">
  <h2>🛒 Tu Pedido</h2>
  <ul id="cart"></ul>

  <button onclick="sendOrder()">
    🚀 Enviar Pedido
  </button>
</div>

<script type="module">
  import { db } from "./firebase.js";

  import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

  const productsDiv = document.getElementById("products");
  const cartUl = document.getElementById("cart");

  let cart = [];

  // ✅ Cargar productos desde Firebase
  async function loadProducts() {

    productsDiv.innerHTML = "";

    const snap = await getDocs(collection(db, "products"));

    snap.forEach(docSnap => {

      const p = docSnap.data();

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h2 style="color:gold;">${p.name}</h2>
        <p>${p.description}</p>
        <p><b>$${p.price}</b></p>

        <button onclick="addToCart('${p.name}')">
          ➕ Agregar
        </button>
      `;

      productsDiv.appendChild(card);
    });
  }

  // ✅ Agregar al carrito
  window.addToCart = function(name) {

    cart.push({ name });

    renderCart();
  };

  // ✅ Mostrar carrito
  function renderCart() {

    cartUl.innerHTML = "";

    cart.forEach(item => {

      const li = document.createElement("li");
      li.innerText = item.name;

      cartUl.appendChild(li);
    });
  }

  // ✅ Enviar pedido a cocina
  window.sendOrder = async function() {

    if (cart.length === 0) {
      alert("⚠️ Carrito vacío");
      return;
    }

    await addDoc(collection(db, "orders"), {
      items: cart,
      status: "pendiente",
      createdAt: serverTimestamp()
    });

    alert("✅ Pedido enviado!");

    cart = [];
    renderCart();
  };

  loadProducts();
</script>

<!-- ✅ PWA Service Worker (Solo este va al final) -->
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js")
      .then(() => console.log("✅ Tutto instalada como App"))
      .catch(err => console.log("Error SW:", err));
  }
</script>

  }
</script>

</body>
</html>
